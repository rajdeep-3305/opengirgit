name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Install test dependencies
        run: pip install pytest ruff numpy

      - name: Lint
        run: ruff check server client tests packaging tools

      - name: Translation catalog is up to date
        run: python tools/collect_strings.py --check

      - name: Unit tests
        run: pytest -q

  windows-tests:
    # The client is Windows-first (WASAPI loopback, RegisterHotKey, capture
    # exclusion). Installing the real client requirements here also verifies
    # that the Windows install path (PyAudioWPatch wheels etc.) works; the
    # platform-independent suite is a hard gate, while the Qt/WebEngine GUI
    # tests stay informational until they have been checked on real hardware
    # (docs/WINDOWS-CHECKLIST.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            client/requirements.txt
            server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r client/requirements.txt -r server/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check server client tests packaging tools

      - name: Unit tests (core)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --ignore tests/test_client_ui.py --ignore tests/test_client_webview.py --ignore tests/test_client_hotkeys.py

      - name: Qt / WebEngine GUI tests (informational)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
        run: pytest -q tests/test_client_ui.py tests/test_client_webview.py tests/test_client_hotkeys.py

  client-import-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile client package
        run: python -m compileall -q client/opengirgit client/main.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: pip install -r server/requirements.txt
      - name: End-to-end (mock LLM + real server + real client API layer)
        run: python tests/e2e/run_e2e.py
